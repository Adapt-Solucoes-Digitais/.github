name: Algo quebrou
description: Tela, link, formulário ou deploy com problema.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: E o que era para ter acontecido.
    validations:
      required: true
  - type: input
    id: endereco
    attributes:
      label: Endereço
      placeholder: "https://..."
  - type: checkboxes
    id: aparelho
    attributes:
      label: Onde aparece
      description: Emulador do navegador engana (já aconteceu com transição de página); confira no aparelho de verdade.
      options:
        - label: iPhone (Safari)
        - label: Android (Chrome)
        - label: Computador
        - label: Só no emulador do navegador
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abrir a home no iPhone
        2. Rolar até o cardápio
        3. ...
